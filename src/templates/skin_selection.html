<!DOCTYPE html>
<html>
<head>
    <title>Seleção de Skin - 2D Game</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .skin-container {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
        }
        .skins-grid {
            display: grid; grid-template-columns: repeat(1, 1fr);
            gap: 20px; margin: 30px 0;
        }
        .skin-option {
            width: 100px; height: 100px; border: 3px solid #ddd;
            border-radius: 10px; cursor: pointer; margin: 0 auto;
            transition: all 0.3s;
        }
        .skin-option.selected { border-color: #667eea; transform: scale(1.1); }
        .skin-1 { background: linear-gradient(45deg, #ff6b6b, #ee5a24); }
        button {
            background: #667eea; color: white; border: none;
            padding: 15px 30px; border-radius: 5px; cursor: pointer;
            font-size: 16px; font-weight: bold;
        }
        button:hover { background: #764ba2; }
    </style>
</head>
<body>
    <div class="skin-container">
        <h2>Selecione sua Skin</h2>
        <div class="skins-grid">
            <div class="skin-option skin-1" onclick="selectSkin(0)"></div>
        </div>
        <button onclick="confirmSkin()">Pronto</button>
    </div>

    <script>
        let selectedSkin = 0;
        
        function selectSkin(index) {
            document.querySelectorAll('.skin-option').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });
            selectedSkin = index;
        }
        
        async function confirmSkin() {
            const response = await fetch('/api/update-skin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({skin_index: selectedSkin})
            });
            
            const result = await response.json();
            
            if (result.success) {
                window.location.href = '/level-selection';
            }
        }
        
        // Selecionar primeira skin por padrão
        selectSkin(0);
    </script>
</body>
</html>
